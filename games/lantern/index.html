<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lantern · Umbra</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #080b12; color: #eee7d9; font: 16px/1.5 system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    header, footer { position: fixed; left: 24px; right: 24px; pointer-events: none; }
    header { top: 20px; } footer { bottom: 20px; }
    h1 { margin: 0; font: 32px Georgia, serif; letter-spacing: .15em; }
    p { margin: 8px 0; text-shadow: 0 2px 4px #000; }
    button { pointer-events: auto; color: #eee7d9; background: #242734; border: 1px solid #868392; padding: 10px 18px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffc36c; outline-offset: 3px; }
    @media (max-width: 600px) { header, footer { left: 12px; right: 12px; } footer { font-size: 13px; } }
  </style>
</head>
<body>
  <canvas aria-label="Lantern game world"></canvas>
  <header><h1>LANTERN</h1><p id="status" role="status" aria-live="polite">Loading the crypt…</p></header>
  <footer><p>W / S walk · A / D turn · Space jump · R restart</p>
    <p>Click the world for mouse look. Esc frees the mouse. Keyboard required.</p>
    <button id="restart" type="button">Restart</button></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
