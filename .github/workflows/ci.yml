name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ── typecheck ──────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter umbra-engine exec tsc --noEmit
      - run: pnpm --filter umbra-agents exec tsc --noEmit
      - run: pnpm --filter @umbra/benchmark exec tsc --noEmit
      - run: pnpm --filter @umbra/lantern build
      - run: pnpm --filter @umbra/boo-and-co build
      - run: pnpm --filter @umbra/studio build
      - run: pnpm --filter @umbra/playground build

  # ── engine tests (includes determinism property tests) ────────────────────
  test-engine:
    name: Engine tests + determinism
    # Playwright 1.56 has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run Vitest (engine + agent API)
        run: pnpm test
      - name: Double-run determinism check on benchmark scenes
        run: pnpm --filter umbra-engine determinism-check
      - name: Install Chromium
        run: pnpm --filter umbra-engine exec playwright install --with-deps chromium
      - name: Browser-vs-Node hash check
        run: pnpm --filter umbra-engine browser-hash-check --with packages/engine/examples/hash-cases.ts --with games/boo-and-co/src/sim/hash-cases.ts

  # ── scene schema validation ────────────────────────────────────────────────
  validate-scenes:
    name: Validate benchmark scenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Validate all scene JSON files
        run: pnpm --filter umbra-engine validate-scenes
