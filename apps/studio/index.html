<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Umbra Studio</title>
  <style>
    :root { --bg: #0d1017; --panel: #151a24; --line: #2a3142; --text: #e8e4da; --muted: #9aa0ad;
      --accent: #ffc36c; --ok: #6fdcb0; --bad: #ff7a7a; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr; background: var(--bg);
      color: var(--text); font: 14px/1.5 system-ui, sans-serif; overflow: hidden; }
    aside { background: var(--panel); border-right: 1px solid var(--line); padding: 20px; overflow-y: auto; }
    h1 { margin: 0 0 4px; font: 22px Georgia, serif; letter-spacing: .14em; }
    h2 { margin: 24px 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .sub { margin: 0; color: var(--muted); font-size: 13px; }
    ul { list-style: none; margin: 0; padding: 0; }
    button, select, label.file { font: inherit; color: var(--text); background: #1e2431; border: 1px solid var(--line);
      border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    button:hover, label.file:hover { border-color: var(--muted); }
    button:focus-visible, select:focus-visible, input:focus-visible, label.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    #samples button { width: 100%; text-align: left; margin-bottom: 6px; }
    #samples button[aria-current="true"] { border-color: var(--accent); }
    #samples small { display: block; color: var(--muted); }
    label.file { display: block; text-align: center; margin-top: 8px; }
    label.file input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    #events button { width: 100%; text-align: left; padding: 6px 10px; margin-bottom: 4px; font-size: 13px; }
    main { position: relative; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #info { position: absolute; top: 16px; left: 16px; right: 16px; pointer-events: none; }
    #title { margin: 0; font-size: 18px; text-shadow: 0 1px 3px #000; }
    #note { margin: 4px 0 8px; max-width: 70ch; color: var(--muted); text-shadow: 0 1px 3px #000; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid; }
    .badge:empty { display: none; }
    .badge.ok { color: var(--ok); border-color: var(--ok); } .badge.bad { color: var(--bad); border-color: var(--bad); }
    #bar { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center;
      background: rgba(21, 26, 36, .92); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
    #scrub { flex: 1; min-width: 80px; accent-color: var(--accent); }
    #tick { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
    #drop { position: absolute; inset: 0; display: none; place-items: center; background: rgba(13, 16, 23, .85);
      border: 2px dashed var(--accent); font-size: 18px; }
    body.dragging #drop { display: grid; }
    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow: auto; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; padding: 16px; }
      main { min-height: 60vh; }
      #bar { flex-wrap: wrap; left: 8px; right: 8px; bottom: 8px; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>UMBRA STUDIO</h1>
    <p class="sub">Replays of agent runs, re-simulated in your browser.</p>
    <h2>Samples</h2>
    <ul id="samples"></ul>
    <label class="file">Open replay file…<input id="file" type="file" accept=".json,application/json" /></label>
    <p class="sub" style="margin-top:8px">Or drop a replay JSON anywhere.</p>
    <h2>Events</h2>
    <ul id="events"><li class="sub">No events.</li></ul>
  </aside>
  <main>
    <canvas aria-label="3D replay view. Drag to orbit, scroll to zoom."></canvas>
    <div id="info"><h2 id="title" style="color:var(--text);text-transform:none;letter-spacing:0">Loading…</h2>
      <p id="note"></p><span id="verify" class="badge" role="status"></span></div>
    <div id="bar">
      <button id="play" type="button" aria-label="Play">Play</button>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Replay tick" />
      <span id="tick">0 / 0</span>
      <select id="speed" aria-label="Playback speed">
        <option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option>
      </select>
      <label><input id="follow" type="checkbox" checked /> Follow</label>
    </div>
    <div id="drop">Drop a replay JSON to load it</div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
